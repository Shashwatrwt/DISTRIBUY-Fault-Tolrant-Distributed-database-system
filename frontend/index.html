<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShardCore — Distributed E-Commerce Demo</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!--
  Loaded in order: api.js defines shared fetch/session helpers first,
  components.js defines the Shop/Admin views next, auth.js defines the
  login page, and app.js (last) defines App and renders it. Classic
  <script> tags share one global scope, so each file's top-level
  functions/consts are visible to the ones loaded after it.

  NOTE: because these are separate files loaded via src=, open this page
  through a local web server (NOT by double-clicking index.html). Browsers
  block script fetches from file:// pages. From this frontend/ folder, run
  one of:
    npx http-server -p 8080
    python3 -m http.server 8080
  then visit http://localhost:8080 in your browser.
-->
<script type="text/babel" src="js/api.js"></script>
<script type="text/babel" src="js/components.js"></script>
<script type="text/babel" src="js/auth.js"></script>
<script type="text/babel" src="js/app.js"></script>
</body>
</html>
